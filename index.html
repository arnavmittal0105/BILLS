<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rough Bill App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f4; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border: 1px solid #ccc; }
        .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        .tab { padding: 8px 15px; background: #e0e0e0; border: 1px solid #b0b0b0; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .tab.active { background: #fff; border-bottom: 2px solid #fff; margin-bottom: -12px; color: #000; }
        .tab-close { background: none; border: none; font-weight: bold; cursor: pointer; color: #d9534f; font-size: 14px; }
        .new-tab-btn { padding: 8px 15px; background: #5cb85c; color: white; border: none; cursor: pointer; font-weight: bold; }
        .order-pane { display: none; }
        .order-pane.active { display: block; }
        .header-row { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
        .header-group { display: flex; flex-direction: column; }
        .header-group label { font-size: 12px; font-weight: bold; margin-bottom: 3px; }
        .header-group input { padding: 6px; font-size: 14px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; font-size: 14px; }
        th { background: #f0f0f0; }
        input[type="text"], input[type="number"] { width: 100%; box-sizing: border-box; padding: 5px; border: 1px solid #ccc; }
        .btn { padding: 8px 12px; cursor: pointer; border: 1px solid #ccc; background: #f8f8f8; font-weight: bold; }
        .btn-add { background: #0275d8; color: white; border: none; margin-bottom: 15px; }
        .btn-print { background: #f0ad4e; color: white; border: none; float: right; }
        .btn-del { background: #d9534f; color: white; border: none; padding: 5px 10px; }
        .totals { font-size: 16px; font-weight: bold; margin-bottom: 15px; text-align: right; }
        
        /* Print Styles - Strips all browser headers, URLs, and extra page info */
        @media print {
            @page {
                size: auto;
                margin: 5mm;
            }
            body { background: none; padding: 0; }
            .tabs, .btn, .no-print, input[type="text"], input[type="number"], .btn-add, .btn-del { display: none !important; }
            .container { border: none; padding: 0; max-width: 100%; }
            .order-pane { display: none !important; }
            .order-pane.active { display: block !important; }
            .print-only-header { display: flex !important; justify-content: space-between; font-size: 16px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
            .print-hide-col { display: none !important; }
            table { width: 100% !important; border: 1px solid #000; }
            th, td { border: 1px solid #000; padding: 6px; font-size: 13px; }
            .totals { font-size: 15px; font-weight: bold; }
        }
        .print-only-header { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs" id="tabsContainer">
        <button class="new-tab-btn" onclick="addNewOrderTab()">+ New Order</button>
    </div>
    <div id="ordersContainer"></div>
</div>

<script>
    let orderCount = 0;

    function createOrderTab(name = "") {
        orderCount++;
        const orderId = 'order_' + orderCount;
        const orderName = name || `Order ${orderCount}`;
        const today = new Date().toISOString().split('T')[0];

        // Create Tab Button
        const tabBtn = document.createElement('div');
        tabBtn.className = 'tab';
        tabBtn.dataset.target = orderId;
        tabBtn.innerHTML = `
            <span class="tab-title" onclick="switchTab('${orderId}')">${orderName}</span>
            <button class="tab-close" onclick="closeTab(event, '${orderId}')">×</button>
        `;
        document.getElementById('tabsContainer').insertBefore(tabBtn, document.querySelector('.new-tab-btn'));

        // Create Order Content Pane
        const pane = document.createElement('div');
        pane.id = orderId;
        pane.className = 'order-pane';
        pane.innerHTML = `
            <!-- Print Header -->
            <div class="print-only-header">
                <div>Customer: <span class="p-cust-name"></span></div>
                <div>Date: <span class="p-date"></span></div>
            </div>

            <div class="header-row no-print">
                <div class="header-group">
                    <label>Customer Name</label>
                    <input type="text" class="cust-name-input" placeholder="Enter customer name" oninput="updatePrintHeader('${orderId}')">
                </div>
                <div class="header-group">
                    <label>Date</label>
                    <input type="date" class="date-input" value="${today}" oninput="updatePrintHeader('${orderId}')">
                </div>
            </div>

            <button class="btn btn-add no-print" onclick="addItem('${orderId}')">+ Add Item</button>
            <button class="btn btn-print" onclick="printOrder('${orderId}')">Print Bill</button>

            <table>
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th class="print-hide-col">Gross Wt</th>
                        <th class="print-hide-col">Tare</th>
                        <th>Net Wt</th>
                        <th>Pcs</th>
                        <th>Rate</th>
                        <th>Price</th>
                        <th class="no-print" style="width: 50px;">Action</th>
                    </tr>
                </thead>
                <tbody class="items-tbody"></tbody>
            </table>

            <div class="totals">
                Total Net Wt: <span class="total-net">0.00</span> | Total Price: <span class="total-price">0.00</span>
            </div>
        `;
        document.getElementById('ordersContainer').appendChild(pane);

        switchTab(orderId);
        addItem(orderId);
    }

    function switchTab(orderId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.order-pane').forEach(p => p.classList.remove('active'));

        const tab = document.querySelector(`.tab[data-target="${orderId}"]`);
        const pane = document.getElementById(orderId);
        if (tab && pane) {
            tab.classList.add('active');
            pane.classList.add('active');
        }
    }

    function closeTab(event, orderId) {
        event.stopPropagation();
        const tabs = document.querySelectorAll('.tab');
        if (tabs.length <= 1) {
            alert("You must keep at least one active order tab.");
            return;
        }

        document.querySelector(`.tab[data-target="${orderId}"]`).remove();
        document.getElementById(orderId).remove();

        const remainingTabs = document.querySelectorAll('.tab');
        if (remainingTabs.length > 0) {
            switchTab(remainingTabs[0].dataset.target);
        }
    }

    function updatePrintHeader(orderId) {
        const pane = document.getElementById(orderId);
        const nameVal = pane.querySelector('.cust-name-input').value || 'Cash Customer';
        const dateVal = pane.querySelector('.date-input').value;
        
        pane.querySelector('.p-cust-name').innerText = nameVal;
        pane.querySelector('.p-date').innerText = dateVal;

        // Update tab label too
        const tab = document.querySelector(`.tab[data-target="${orderId}"] .tab-title`);
        if (tab) tab.innerText = pane.querySelector('.cust-name-input').value || 'Order';
    }

    function addItem(orderId) {
        const pane = document.getElementById(orderId);
        const tbody = pane.querySelector('.items-tbody');
        const row = document.createElement('tr');

        row.innerHTML = `
            <td><input type="text" class="item-name" placeholder="Item name"></td>
            <td class="print-hide-col"><input type="number" class="item-gross" step="any" value="0" oninput="calcRow(this)"></td>
            <td class="print-hide-col"><input type="number" class="item-tare" step="any" value="0" oninput="calcRow(this)"></td>
            <td><input type="number" class="item-net" step="any" value="0" oninput="calcNetManual(this)"></td>
            <td><input type="number" class="item-pcs" value="1"></td>
            <td><input type="number" class="item-rate" step="any" value="0" oninput="calcRow(this)"></td>
            <td class="item-total-price">0.00</td>
            <td class="no-print" style="text-align:center;"><button class="btn btn-del" onclick="deleteRow(this)">X</button></td>
        `;
        tbody.appendChild(row);
    }

    function calcRow(element) {
        const row = element.closest('tr');
        const gross = parseFloat(row.querySelector('.item-gross').value) || 0;
        const tare = parseFloat(row.querySelector('.item-tare').value) || 0;
        const net = Math.max(0, gross - tare);
        
        row.querySelector('.item-net').value = net.toFixed(2);
        
        const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
        const price = net * rate;
        row.querySelector('.item-total-price').innerText = price.toFixed(2);

        calcTotals(row.closest('.order-pane'));
    }

    function calcNetManual(element) {
        const row = element.closest('tr');
        const net = parseFloat(row.querySelector('.item-net').value) || 0;
        const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
        const price = net * rate;
        row.querySelector('.item-total-price').innerText = price.toFixed(2);

        calcTotals(row.closest('.order-pane'));
    }

    function deleteRow(btn) {
        const row = btn.closest('tr');
        const pane = row.closest('.order-pane');
        row.remove();
        calcTotals(pane);
    }

    function calcTotals(pane) {
        let totalNet = 0;
        let totalPrice = 0;

        pane.querySelectorAll('.items-tbody tr').forEach(row => {
            totalNet += parseFloat(row.querySelector('.item-net').value) || 0;
            totalPrice += parseFloat(row.querySelector('.item-total-price').innerText) || 0;
        });

        pane.querySelector('.total-net').innerText = totalNet.toFixed(2);
        pane.querySelector('.total-price').innerText = totalPrice.toFixed(2);
    }

    function printOrder(orderId) {
        updatePrintHeader(orderId);
        
        // Hide all panes, show only the selected one for printing
        document.querySelectorAll('.order-pane').forEach(p => p.classList.remove('active'));
        const pane = document.getElementById(orderId);
        pane.classList.add('active');

        window.print();
    }

    // Initialize first tab on load
    addNewOrderTab();
</script>

</body>
</html>
